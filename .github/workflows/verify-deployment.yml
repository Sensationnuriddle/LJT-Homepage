name: Verify deployed homepage

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Show Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${GITHUB_REPOSITORY}/pages || true

      - name: Check public pages and required content
        run: |
          set -euo pipefail
          base="https://sensationnuriddle.github.io/LJT-Homepage"
          mkdir -p /tmp/ljt
          for path in "" "publications/" "cv/" "sitemap/"; do
            slug="${path%/}"
            slug="${slug:-home}"
            echo "Checking ${base}/${path} -> ${slug}.html"
            curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors \
              "${base}/${path}" -o "/tmp/ljt/${slug}.html"
          done
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors \
            "${base}/assets/css/main.css" -o /tmp/ljt/main.css

          home=/tmp/ljt/home.html
          pubs=/tmp/ljt/publications.html
          cv=/tmp/ljt/cv.html

          grep -q "Junteng Liu" "$home"
          grep -q "jliugi@connect.ust.hk" "$home"
          grep -q "Academic Background" "$home"
          grep -q "Research Experience" "$home"
          grep -q "SynLogic" "$home"
          grep -q "On the Perception Bottleneck" "$home"
          grep -q "Universal Truthfulness Hyperplane" "$home"
          grep -q "In-Context Sharpness" "$home"
          grep -q "C-Eval" "$home"
          grep -q "Composing Parameter-Efficient Modules" "$home"
          grep -q "Skills &amp; Research Expertise" "$home"
          grep -q "Contact Information" "$home"
          grep -q "SynLogic" "$pubs"
          grep -q "Zhiyuan Honor Scholarship" "$cv"
          test -s /tmp/ljt/main.css
          echo "All deployment content checks passed."
