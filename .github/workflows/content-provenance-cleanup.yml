name: Normalize optional code references

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Remove externally discovered code URLs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [Path('_pages/about.md'), Path('_pages/cv.md')]
          paths += list(Path('_publications').glob('*.md'))
          link = re.compile(r'\[([^\]]+)\]\(https://github\.com/[^)]+\)')

          def label_to_name(match):
              label = match.group(1)
              if '/' in label:
                  return '`' + label.split('/')[-1] + '`'
              return label

          for path in paths:
              text = path.read_text()
              text = re.sub(r'^code_repository:.*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'^code_url:.*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'\s*·\s*\[Code\]\([^)]*\)', '', text)
              text = link.sub(label_to_name, text)
              path.write_text(text)
          PY

          rm -f .github/workflows/content-provenance-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _pages _publications .github/workflows/content-provenance-cleanup.yml

          if grep -R -E 'MiniMax-AI/SynLogic|hkust-nlp/(Vision4Chart|Universal_Truthfulness_Hyperplane)' _pages _publications; then
            echo 'Externally discovered code owner references remain.' >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No provenance changes needed.'
          else
            git commit -m 'Keep code references limited to memory names'
            git push origin HEAD:master
          fi
