name: Verify deployed homepage

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Show Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${GITHUB_REPOSITORY}/pages || true

      - name: Check public pages and required content
        run: |
          set -euo pipefail
          base="https://sensationnuriddle.github.io/LJT-Homepage"
          mkdir -p /tmp/ljt
          for path in "" "publications/" "cv/" "sitemap/"; do
            name=$(echo "${path:-home}" | tr '/' '-')
            echo "Checking ${base}/${path}"
            curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors \
              "${base}/${path}" -o "/tmp/ljt/${name}.html"
          done
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors \
            "${base}/assets/css/main.css" -o /tmp/ljt/main.css

          grep -q "Junteng Liu" /tmp/ljt/-home.html
          grep -q "jliugi@connect.ust.hk" /tmp/ljt/-home.html
          grep -q "Academic Background" /tmp/ljt/-home.html
          grep -q "Research Experience" /tmp/ljt/-home.html
          grep -q "SynLogic" /tmp/ljt/-home.html
          grep -q "On the Perception Bottleneck" /tmp/ljt/-home.html
          grep -q "Universal Truthfulness Hyperplane" /tmp/ljt/-home.html
          grep -q "In-Context Sharpness" /tmp/ljt/-home.html
          grep -q "C-Eval" /tmp/ljt/-home.html
          grep -q "Composing Parameter-Efficient Modules" /tmp/ljt/-home.html
          grep -q "Skills &amp; Research Expertise" /tmp/ljt/-home.html
          grep -q "Contact Information" /tmp/ljt/-home.html
          grep -q "SynLogic" /tmp/ljt/publications-.html
          grep -q "Zhiyuan Honor Scholarship" /tmp/ljt/cv-.html
          test -s /tmp/ljt/main.css
          echo "All deployment content checks passed."
